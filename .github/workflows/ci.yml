name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: last-comments-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      business-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: business
          POSTGRES_PASSWORD: business
          POSTGRES_DB: business_comments
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/last-comments-test
      BUSINESS_DATABASE_URL: postgres://business:business@localhost:5435/business_comments
      PAYLOAD_SECRET: ci-only-dummy-secret-override-at-runtime-1234567890
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-override-at-runtime-1234567890
      BETTER_AUTH_URL: http://localhost:3000
      PAYLOAD_BUNX_FLAGS: --bun
      PAYLOAD_CLI_ARGS: --disable-transpile
      # Production builds reject loopback origins.
      PAYLOAD_PUBLIC_SERVER_URL: https://example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - run: bun run generate:types
      - run: bun run generate:importmap
      - run: bun run generate:payload-admin-css
      - run: bun run check
      - run: bun run db:migrate
      - run: bun run db:business:migrate
      - run: bun test
      - run: |
          export NITRO_PRESET=bun
          bun run build
          (bun scripts/start.ts & echo $! > /tmp/last-comments-server.pid)
          for i in $(seq 1 30); do
            curl -sf --max-time 2 http://localhost:3000/api/live && break
            sleep 2
          done
          SMOKE_BASE_URL=http://localhost:3000 bun run smoke
          kill "$(cat /tmp/last-comments-server.pid)"

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # `cd` deploys the image this job publishes; pull uses packages: read.
      packages: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: last-comments-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      business-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: business
          POSTGRES_PASSWORD: business
          POSTGRES_DB: business_comments
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Service containers publish on the runner; the Compose app reaches them
      # as host.docker.internal (mapped to host-gateway in compose.yaml).
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/last-comments-test
      BUSINESS_DATABASE_URL: postgres://business:business@host.docker.internal:5435/business_comments
      # Compose requires both secrets, and it runs in production mode, which needs a public origin.
      PAYLOAD_SECRET: ci-only-dummy-secret-override-at-runtime-1234567890
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-override-at-runtime-1234567890
      PAYLOAD_PUBLIC_SERVER_URL: https://example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        run: echo "BUN_VERSION=$(cat .bun-version)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main publishes the image the CD pulls; PRs only load it for the stack
      # smoke test below (buildx cannot load and push in one step).
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reuse the published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker pull "ghcr.io/${{ github.repository }}:${{ github.sha }}"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start stack
        env:
          LAST_COMMENTS_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        # The one-shot migration service exits, and the worker has no HTTP
        # healthcheck; the smoke step below polls the app instead.
        run: docker compose up -d --no-build
      - name: Smoke
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:3000/api/live >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/live
          curl -fsS http://localhost:3000/api/ready
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/docs
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
